een barcodes\",\"detailsAlt\":\"Real screen showing organised Italian health card details in TesSa\",\"barcodeAlt\":\"Real TesSa screen showing a barcode at full size\"},\"family\":{\"eyebrow\":\"Several people, one device\",\"title\":\"Your documents. And your family's.\",\"description\":\"Organise documents for several people on the same device and find the right one quickly.\",\"imageAlt\":\"Real TesSa wallet screen organised for several people\"},\"sharing\":{\"eyebrow\":\"A deliberate action\",\"title\":\"Share when you choose.\",\"description\":\"Start a card transfer from TesSa using a QR code or link.\",\"qr\":\"QR code\",\"link\":\"Link\",\"note\":\"Sharing always starts with an action you take in the app.\",\"imageAlt\":\"Real TesSa screen showing a QR code used to share a card\"},\"privacy\":{\"eyebrow\":\"Local by design\",\"title\":\"Your document records stay on your device.\",\"description\":\"TesSa stores document records locally and does not use a proprietary cloud service to hold your wallet. You can protect access with a PIN or biometrics.\",\"local\":\"Local storage\",\"pin\":\"Optional PIN\",\"biometric\":\"Biometric access\",\"settingsAlt\":\"Real TesSa settings screen showing PIN, biometrics and backup\",\"pinAlt\":\"Real TesSa access screen protected by PIN and fingerprint\"},\"backup\":{\"eyebrow\":\"Continuity on your terms\",\"title\":\"Take your wallet with you.\",\"description\":\"Create an encrypted backup, export it wherever you choose and restore it when needed. Backup and restore are available free to everyone.\",\"create\":\"Create a backup\",\"manual\":\"Manual export\",\"encrypted\":\"Encrypted file stored in TesSa\",\"restore\":\"Restore when needed\",\"restoreNote\":\"Restoring replaces the current wallet only after you confirm it.\"},\"showcase\":{\"eyebrow\":\"The real product\",\"title\":\"TesSa in everyday use.\",\"description\":\"Find, view, share and manage documents through a clear, familiar interface.\",\"walletLabel\":\ stion\":\"Where can I find the backup I created?\",\"answer\":\"When you create a backup, the file remains in TesSa's internal app storage and does not automatically appear among the files on your device. To keep a copy outside the app, use the export function and choose where to save or share it.\"},{\"question\":\"How can I protect access to my documents?\",\"answer\":\"You can protect access to TesSa with a PIN and, on compatible devices, also use biometric authentication.\"},{\"question\":\"Is TesSa an official Public Administration app?\",\"answer\":\"No. TesSa is an independent app and is not an official Public Administration app. It helps you organise and view your document data, but it does not replace the original documents.\"},{\"question\":\"Which devices can I use TesSa on?\",\"answer\":\"TesSa is available for Android and iOS.\"}]},\"finalCta\":{\"eyebrow\":\"Ready for Android and iOS\",\"title\":\"Bring your documents together.\",\"description\":\"Download TesSa for Android or iOS.\"},\"stores\":{\"googleAlt\":\"Get TesSa on Google Play\",\"appleAlt\":\"Download TesSa on the App Store\"},\"footer\":{\"description\":\"The local-first wallet for the personal documents you use every day.\",\"product\":\"Product\",\"legal\":\"Legal information\",\"copyright\":\"Baleen Developers. All rights reserved.\"}},\"share\":{\"eyebrow\":\"Shared document\",\"notice\":\"This link contains the document data shown here. Share it only with people you trust and treat it like a personal document.\",\"loading\":\"Reading the shared card…\",\"documentTypes\":{\"TS\":\"Italian health card\",\"CIE\":\"Electronic Identity Card (CIE)\",\"P\":\"Driving licence\"},\"actionTitles\":{\"TS\":\"Add this Italian health card to your wallet\",\"CIE\":\"Add this CIE to your wallet\",\"P\":\"Add this driving licence to your wallet\"},\"actionDescriptions\":{\"TS\":\"You received an Italian health card for {name}. Download TesSa to add it directly to your wallet.\",\"CIE\":\"You received a
